name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test recognition state machine
        run: swift test
      - name: Build app bundle
        run: bash scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/IrisGate.app dist/IrisGate.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IrisGate-macOS
          path: dist/IrisGate.zip
